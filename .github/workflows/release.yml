name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example, v1.2.3)."
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  quality:
    name: quality gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate strict SemVer tag
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "${RELEASE_TAG}" =~ ${semver} ]]; then
            echo "Tag '${RELEASE_TAG}' must be vMAJOR.MINOR.PATCH with an optional SemVer prerelease suffix." >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          prerelease="${version#*-}"
          if [[ "${prerelease}" == "${version}" ]]; then
            exit 0
          fi
          IFS='.' read -r -a identifiers <<< "${prerelease}"
          for identifier in "${identifiers[@]}"; do
            if [[ "${identifier}" =~ ^[0-9]+$ ]] && [[ "${identifier}" =~ ^0[0-9]+$ ]]; then
              echo "Numeric prerelease identifiers must not contain leading zeroes: '${identifier}'." >&2
              exit 1
            fi
          done

      - name: Checkout exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify checked-out tag
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev xvfb \
            libwayland-dev wayland-protocols libxkbcommon-dev

      - name: Test GUI
        shell: bash
        run: xvfb-run -a go test -tags gui ./...

      - name: Test TUI
        shell: bash
        run: go test -tags tui ./...

      - name: Vet GUI
        shell: bash
        run: go vet -tags gui ./...

      - name: Vet TUI
        shell: bash
        run: go vet -tags tui ./...

  gui-binaries:
    name: GUI (${{ matrix.platform }})
    needs: quality
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: windows-amd64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Keep this package list aligned with the Linux quality gate.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev xvfb \
            libwayland-dev wayland-protocols libxkbcommon-dev

      - name: Build desktop GUI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          name="keysmith-${RELEASE_TAG}-${{ matrix.platform }}"
          ext=""
          [ "$(uname -s)" = "MINGW"* ] || [ "$(uname -s)" = "CYGWIN"* ] && ext=".exe"
          output="out/${name}${ext}"
          go build -tags gui -trimpath -ldflags "-s -w -X main.version=${RELEASE_TAG}" \
            -o "${output}" ./cmd/keysmith
          test -s "${output}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  tui-binaries:
    name: TUI (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: quality
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-compile terminal UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          ext=""
          [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
          output="out/keysmith-tui-${RELEASE_TAG}-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -tags tui -trimpath -ldflags "-s -w -X main.version=${RELEASE_TAG}" \
            -o "${output}" ./cmd/keysmith
          test -s "${output}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/*
          if-no-files-found: error

  npm-package:
    name: npm package
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Stage package
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ -e pkg || -e out ]]; then
            echo "Refusing to overwrite existing package staging paths." >&2
            exit 1
          fi
          mkdir -p pkg/bin out
          cp package.release.json pkg/package.json
          sed -i "s|0.0.0-PLACEHOLDER|${version}|g" pkg/package.json
          cp bin/keysmith.js pkg/bin/keysmith.js
          chmod +x pkg/bin/keysmith.js
          node - <<'NODE'
          const expected = process.env.RELEASE_TAG.replace(/^v/, "");
          const manifest = require("./pkg/package.json");
          if (manifest.version !== expected) throw new Error("package version does not match the release tag");
          if (JSON.stringify(manifest.files) !== JSON.stringify(["bin"])) throw new Error("unexpected package files field");
          if (manifest.bin.keysmith !== "bin/keysmith.js") throw new Error("unexpected GUI bin mapping");
          if (manifest.bin["keysmith-tui"] !== "bin/keysmith.js") throw new Error("unexpected TUI bin mapping");
          NODE

      - name: Pack and inspect npm tarball
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          mkdir -p out
          # Pack the staged pkg/ directory, not the repository root. The root
          # manifest is the 0.0.0-PLACEHOLDER template, so packing it yields
          # keysmith-0.0.0-PLACEHOLDER.tgz instead of the release tarball.
          npm pack ./pkg --pack-destination out
          mapfile -d '' tarballs < <(find out -maxdepth 1 -type f -name '*.tgz' -print0)
          test "${#tarballs[@]}" -eq 1
          expected="keysmith-${RELEASE_TAG#v}.tgz"
          test "${tarballs[0]}" = "out/${expected}"
          expected_contents="$(mktemp)"
          actual_contents="$(mktemp)"
          trap 'rm -f "${expected_contents}" "${actual_contents}"' EXIT
          printf '%s\n' \
            'package/bin/keysmith.js' \
            'package/package.json' | sort > "${expected_contents}"
          tar -tzf "${tarballs[0]}" | sort > "${actual_contents}"
          diff -u "${expected_contents}" "${actual_contents}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: out/*.tgz
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [gui-binaries, tui-binaries, npm-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify release asset names
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          expected_file="$(mktemp)"
          actual_file="$(mktemp)"
          trap 'rm -f "${expected_file}" "${actual_file}"' EXIT
          {
            echo "keysmith-${RELEASE_TAG}-linux-amd64"
            echo "keysmith-${RELEASE_TAG}-darwin-arm64"
            echo "keysmith-${RELEASE_TAG}-windows-amd64.exe"
            for target in \
              linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 \
              windows-amd64 windows-arm64; do
              if [[ "${target}" == windows-* ]]; then
                echo "keysmith-tui-${RELEASE_TAG}-${target}.exe"
              else
                echo "keysmith-tui-${RELEASE_TAG}-${target}"
              fi
            done
            echo "keysmith-${RELEASE_TAG#v}.tgz"
          } | sort > "${expected_file}"
          find artifacts -type f -printf '%f\n' | sort > "${actual_file}"
          diff -u "${expected_file}" "${actual_file}"
          while IFS= read -r asset; do
            asset_path="$(find artifacts -type f -name "${asset}" -print -quit)"
            test -n "${asset_path}"
            test -s "${asset_path}"
          done < "${expected_file}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  npm-publish:
    name: publish npm
    needs: [release, npm-package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download npm package
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-package

      - name: Check npm credentials
        id: auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::warning::NPM_TOKEN is not configured; the GitHub release was published without publishing to npm."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js for publishing
        if: steps.auth.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        if: steps.auth.outputs.publish == 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ contains(env.RELEASE_TAG, '-') && 'next' || 'latest' }}
        run: |
          set -euo pipefail
          mapfile -d '' tarballs < <(find npm-package -maxdepth 1 -type f -name '*.tgz' -print0)
          test "${#tarballs[@]}" -eq 1
          npm publish "${tarballs[0]}" --access public --tag "${NPM_DIST_TAG:-latest}"
