name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g., v1.2.3). Required when manually dispatching."
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        run: |
          if [ -z "${RELEASE_TAG}" ]; then
            echo "No tag detected."
            echo "- If you ran this manually: provide 'tag' input (e.g. v1.0.0)."
            echo "- If you want automatic releases: push a tag (git tag v1.0.0 && git push origin v1.0.0)."
            exit 1
          fi
          case "${RELEASE_TAG}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag '${RELEASE_TAG}' is not semver-like (expected vMAJOR.MINOR.PATCH)."; exit 1 ;;
          esac

  gui-binaries:
    name: GUI (${{ matrix.os }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: windows-amd64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Native build of the Fyne desktop frontend (default, untagged variant).
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev

      - name: Build desktop GUI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          name="keysmith-${RELEASE_TAG}-${{ matrix.platform }}"
          ext=""
          [ "$(uname -s)" = "MINGW"* ] || [ "$(uname -s)" = "CYGWIN"* ] && ext=".exe"
          go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_TAG}" \
            -o "out/${name}${ext}" ./cmd/keysmith

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  tui-binaries:
    name: TUI (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The `tui` build tag excludes Fyne entirely, so these are pure Go and
      # cross-compile anywhere without a C toolchain.
      - name: Cross-compile terminal UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          ext=""
          [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -tags tui -trimpath -ldflags "-s -w -X main.version=${RELEASE_TAG}" \
            -o "out/keysmith-tui-${RELEASE_TAG}-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" \
            ./cmd/keysmith

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/*
          if-no-files-found: error

  npm-package:
    name: npm package
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check npm credentials
        id: auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::warning::NPM_TOKEN secret is not set; skipping npm publish (package still attached to the Release)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage package
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p pkg/bin
          cp package.release.json pkg/package.json
          sed -i "s|0.0.0-PLACEHOLDER|${version}|g" pkg/package.json
          for f in bin/keysmith*; do
            [ -f "$f" ] && cp "$f" pkg/bin/
          done
          chmod +x pkg/bin/*

      - name: Pack tarball
        working-directory: pkg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../out
          npm pack --pack-destination ../out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: out/*.tgz
          if-no-files-found: error

      - name: Publish to npm
        if: steps.auth.outputs.publish == 'true'
        working-directory: pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  release:
    needs: [gui-binaries, tui-binaries, npm-package]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
