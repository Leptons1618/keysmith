name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g., v1.2.3). Required when manually dispatching."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build (PyInstaller)
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ssh-key-setup main.py

      - name: Prepare release binary
        shell: bash
        run: |
          set -euo pipefail
          python - << 'PY'
          import os
          import platform
          import shutil
          from pathlib import Path

          tag = os.getenv('GITHUB_REF_NAME', 'dev')
          sys = platform.system().lower()
          arch = platform.machine().lower()

          name = 'ssh-key-setup'
          ext = '.exe' if sys.startswith('windows') else ''
          exe = name + ext
          binary = Path('dist') / exe
          if not binary.exists():
              # PyInstaller sometimes nests inside a folder on some platforms
              nested = Path('dist') / name / exe
              if nested.exists():
                  binary = nested

          if not binary.exists():
              raise SystemExit(f'Built binary not found: {binary}')

          out = Path('dist') / f'{name}-{tag}-{sys}-{arch}{ext}'
          out.parent.mkdir(parents=True, exist_ok=True)

          shutil.copy2(binary, out)

          print(out.as_posix())
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-key-setup-${{ matrix.os }}
          path: |
            dist/ssh-key-setup-*
            !dist/*.spec

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}

    steps:
      - name: Validate tag
        run: |
          if [ -z "${RELEASE_TAG}" ]; then
            echo "No tag detected."
            echo "- If you ran this manually: provide 'tag' input (e.g. v1.0.0)."
            echo "- If you want automatic releases: push a tag (git tag v1.0.0 && git push origin v1.0.0)."
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: artifacts/**/ssh-key-setup-*
          generate_release_notes: true
          fail_on_unmatched_files: true
