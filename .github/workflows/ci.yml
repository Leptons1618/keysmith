name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-test:
    name: ${{ matrix.frontend }} (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        frontend: [gui, tui]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Keep the Linux GUI packages identical to the release build environment.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux' && matrix.frontend == 'gui'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev xvfb \
            libwayland-dev wayland-protocols libxkbcommon-dev

      - name: Test GUI under Xvfb
        if: runner.os == 'Linux' && matrix.frontend == 'gui'
        shell: bash
        run: xvfb-run -a go test -tags gui ./...

      - name: Test
        if: ${{ runner.os != 'Linux' || matrix.frontend == 'tui' }}
        shell: bash
        run: go test -tags ${{ matrix.frontend }} ./...

      - name: Vet
        shell: bash
        run: go vet -tags ${{ matrix.frontend }} ./...

      - name: Smoke build TUI targets
        if: runner.os == 'Linux' && matrix.frontend == 'tui'
        shell: bash
        run: |
          set -euo pipefail
          for target in "windows amd64" "darwin amd64" "darwin arm64"; do
            read -r goos goarch <<< "$target"
            echo "== GOOS=${goos} GOARCH=${goarch} =="
            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 \
              go build -tags tui -trimpath -o /dev/null ./cmd/keysmith
          done
